<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Console</title>
    <style>
        #message-store{
            margin: 3px;
            padding: 6px;
            border: 1px solid black;
            min-height: 100px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>WebSocket Broadcast Console</h1>
    <p id="status">Connecting...</p>
    <form id="message-form">
        <input id="message-input" placeholder="typing..." autocomplete="off" />
        <button type="submit" id="submitButton">send</button>
    </form>
    <div id="message-store"></div>

    <script>
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const messageStore = document.getElementById('message-store');
        const statusText = document.getElementById('status');

        //1 initiate the handshake
        const socket = new WebSocket("ws://localhost:8080");

        const appendLog = (label,message) => {
            const entry = `${new Date().toLocaleTimeString()} ${label} ${message}\n`;
            messageStore.textContent = entry + messageStore.textContent;
        }

        socket.addEventListener('open',()=>{
            statusText.textContent = 'Connected';
            appendLog('[SYSTEM]','Connected');
        })

        socket.addEventListener('close',()=>{
            statusText.textContent = 'Disconnected';
            appendLog('[SYSTEM]','Disconnected');
        })

        socket.addEventListener('error',()=>{
            appendLog('[ERROR]','Connection error (is the server running on :8080?)');
        })

        socket.addEventListener('message',(e)=>{
            appendLog('[RECEIVED]',e.data);
        })

        messageForm.addEventListener('submit',(e)=>{
            e.preventDefault();

            if(socket.readyState !== WebSocket.OPEN){
                appendLog('[ERROR]','No active tunnel');
                return;
            }

            const msg = messageInput.value.trim();
            if(!msg) return;

            
            socket.send(msg);
            appendLog('[SENT]',msg);
            messageInput.value = '';
        })
    </script>
</body>
</html>
